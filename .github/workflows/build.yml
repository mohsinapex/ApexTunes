name: Build ApexTunes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleFossRelease
        env:
          APEXTUNES_APPLICATION_ID: com.mohsinraza.mohsinapexmusic
          APEXTUNES_APP_NAME: ApexTunes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTunes
          path: app/build/outputs/apk/foss/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ApexTunes v${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/foss/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
